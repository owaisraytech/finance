<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vida Financing Calculator</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e1d8;--accent:#0f5c63}
*{box-sizing:border-box}body{margin:0;font:17px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:1100px;margin:auto;padding:24px 16px;display:grid;gap:20px;grid-template-columns:340px 1fr}
h1{grid-column:1/-1;margin:0;font-size:1.5rem}h2{font-size:1rem;margin:0 0 8px;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
label{display:block;font-weight:600;margin:0 0 14px}label span{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input,select{width:100%;min-height:52px;font-size:1.1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
input:invalid{border-color:#c0392b}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.hero div{background:var(--accent);color:#fff;border-radius:14px;padding:18px}
.hero small{opacity:.85}.hero b{display:block;font-size:2rem}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:16px}
dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 12px}dt{color:var(--mute)}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
#err{color:#c0392b;font-weight:600}
dd{white-space:nowrap}dt{min-width:0}html{-webkit-text-size-adjust:100%}
@media (max-width:820px){main{grid-template-columns:1fr}
  #f{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}#f label:first-child{grid-column:1/-1}}
@media (max-width:520px){
  body{font-size:16px}main{padding:16px 12px calc(16px + env(safe-area-inset-bottom));gap:14px}
  h1{font-size:1.25rem}.card{padding:14px;border-radius:12px}
  #f{grid-template-columns:1fr}label{margin-bottom:10px}
  .hero{position:sticky;top:0;z-index:1;gap:8px;margin-bottom:12px;padding-top:4px;background:var(--bg)}
  .hero,.sections{grid-template-columns:1fr 1fr}.sections{grid-template-columns:1fr;gap:12px}
  .hero div{padding:12px}.hero small{font-size:.75rem}.hero b{font-size:1.35rem}}
</style>
</head>
<body>
<main>
  <h1>Vida Financing Calculator</h1>
  <form class="card" id="f" onsubmit="return false">
    <label><span>Sale amount ($)</span><input id="sale" type="number" inputmode="decimal" min="0.01" step="0.01" value="30000" required></label>
    <label><span>Down payment</span><select id="dp"><option value="0.25">25%</option><option value="0.30">30%</option><option value="0.35">35%</option></select></label>
    <label><span>Client credit card (7–10%)</span><input id="cc" type="number" inputmode="decimal" min="7" max="10" step="0.01" value="10" required></label>
    <label><span>Trustline term</span><select id="term"></select></label>
    <label><span>Vidanta financing term</span><select id="years"></select></label>
  </form>
  <section id="out"><p id="err"></p><div id="res"></div></section>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
